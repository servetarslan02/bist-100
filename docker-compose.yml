version: '3.8'

x-common: &common
  restart: unless-stopped
  env_file: .env
  networks:
    - alpha-net

services:
  # === Data Stores ===
  postgres:
    <<: *common
    image: postgres:16-alpine
    mem_limit: 1g
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpha_bist}
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_secure_2026}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:24.8-alpine
    mem_limit: 2g
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse/init:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-alpha_bist}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *common
    image: redis:7-alpine
    mem_limit: 512m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Event Bus ===
  redpanda:
    <<: *common
    image: redpandadata/redpanda:v24.2.8
    mem_limit: 1g
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 2
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9093
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9093
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:8083
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:8083
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:8084
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Application Services ===
  api:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 512m
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./services:/app/services
      - ./ml:/app/ml
      - ./ai:/app/ai
      - ./backtest:/app/backtest
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  ingestion:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 256m
    command: python -m services.ingestion.main
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  feature-engine:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 512m
    command: python -m services.features.main
    volumes:
      - ./services:/app/services
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  market-state:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 256m
    command: python -m services.market_state.main
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  intelligence:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 512m
    command: python -m services.intelligence.main
    volumes:
      - ./services:/app/services
      - ./ml:/app/ml
      - ./ai:/app/ai
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  simulation:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 512m
    command: python -m services.simulation.main
    volumes:
      - ./services:/app/services
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  risk:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 256m
    command: python -m services.risk.main
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  portfolio:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 256m
    command: python -m services.portfolio.main
    volumes:
      - ./services:/app/services
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  learning:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    mem_limit: 1g
    command: python -m services.learning.main
    volumes:
      - ./services:/app/services
      - ./ml:/app/ml
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Frontend ===
  dashboard:
    <<: *common
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  # === Monitoring ===
  prometheus:
    <<: *common
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    <<: *common
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  # === MLflow ===
  mlflow:
    <<: *common
    image: ghcr.io/mlflow/mlflow:v2.15.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD:-alpha_secure_2026}@postgres:5432/${POSTGRES_DB:-alpha_bist} --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
  mlflow_artifacts:

networks:
  alpha-net:
    driver: bridge
