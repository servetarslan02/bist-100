name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --select E,F,W,B --ignore E501,E402

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -x --timeout=30 -q --tb=short
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-min-16-chars
          SYSTEM_API_KEY: ci-system-key-test

  # PostgreSQL integration tests (yeni)
  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: alpha_bist
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_postgresql_integration.py -v --timeout=30
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: alpha_bist

  # SQL syntax validation (yeni)
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SQL files
        run: |
          for sql_file in database/init/*.sql; do
            echo "Validating: $sql_file"
            # Temel syntax kontrolü (boş olmayan dosyalar)
            if [ -s "$sql_file" ]; then
              echo "  ✅ $sql_file — OK"
            else
              echo "  ❌ $sql_file — Boş dosya!"
              exit 1
            fi
          done

  # Python syntax validation (yeni)
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: |
          python -c "
          import ast
          import sys
          from pathlib import Path

          files = [
              'services/core/database.py',
              'services/core/pit_queries.py',
              'scripts/audit_query_performance.py',
              'scripts/audit_timescaledb_health.py',
              'scripts/run_migrations.py',
          ]

          errors = []
          for f in files:
              path = Path(f)
              if not path.exists():
                  errors.append(f'{f}: Dosya bulunamadı')
                  continue
              try:
                  with open(path, 'r') as fh:
                      ast.parse(fh.read())
                  print(f'✅ {f}')
              except SyntaxError as e:
                  errors.append(f'{f}: Syntax hatası — {e}')
                  print(f'❌ {f}: {e}')

          if errors:
              print(f'\n❌ {len(errors)} hata bulundu!')
              sys.exit(1)
          else:
              print(f'\n✅ Tüm dosyalar geçerli')
          "

  # OpenAPI contract testing (yeni)
  openapi-contract:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install schemathesis
      - name: Start API in background
        run: |
          python -m uvicorn services.api.app:create_app --factory --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          SYSTEM_API_KEY: ci-system-test
      - name: Run OpenAPI contract tests
        run: |
          python -m pytest tests/test_openapi_contract.py -v --timeout=30
        env:
          API_BASE_URL: http://localhost:8000
      - name: Run schemathesis fuzzing
        run: |
          schemathesis run http://localhost:8000/openapi.json \
            --checks all \
            --max-response-time 5000 \
            --stateful=links \
            --hypothesis-max-examples 50 \
            --dry-run || true
        env:
          API_BASE_URL: http://localhost:8000

  # Vulnerability scanning (yeni)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python dependency vulnerability scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install safety
        run: pip install safety
      - name: Scan Python dependencies
        run: |
          safety check -r requirements.txt --output text || true
        continue-on-error: true

      # Static Application Security Testing (SAST)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run SAST scan
        run: |
          bandit -r services/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r services/ \
            --severity-level medium \
            --confidence-level medium \
            --format txt || true
        continue-on-error: true

      # Container image vulnerability scan
      - name: Build Docker image
        run: docker build -f infrastructure/Dockerfile.api -t alpha-bist-api:scan .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'alpha-bist-api:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        continue-on-error: true

      # Upload scan results
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            bandit-report.json
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-postgresql, validate-sql, validate-python, openapi-contract, security-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/Dockerfile.api -t alpha-bist-api .
