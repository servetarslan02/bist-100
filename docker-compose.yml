  nats:
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id001
    networks: *id002
    logging: *id003
    image: nats:2.11-alpine
    container_name: alpha-nats
    ports:
    - 4222:4222
    - 8222:8222
    command: "nats-server\n  --jetstream\n  --store_dir /data\n  --max_payload 1048576\n  --max_pending 67108864\n  --sync_interval\
      \ 30s\n"
    volumes:
    - nats_data:/data
    mem_limit: 128m
    cpus: 0.25
    storage_opt:
      size: 128M
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8222/healthz
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  api:
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: *id001
    networks: *id002
    logging: *id003
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: alpha-bist-base:latest
    container_name: alpha-api
    ports:
    - 8000:8000
    - 50051:50051
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./ai:/app/ai:ro
    - ./backtest:/app/backtest:ro
    - ./config:/app/config:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=32M,mode=1777
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    environment:
    - TORCH_DEVICE=cuda
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - NATS_URL=nats://nats:4222
    - GRPC_PORT=50051
    - GRPC_HOSTS=alpha-api
    - REDIS_SENTINEL_HOSTS=alpha-sentinel-1:26379,alpha-sentinel-2:26379,alpha-sentinel-3:26379
    - REDIS_SENTINEL_MASTER=alpha-master
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_SERVER_CERT=/app/certs/server.crt
    - MTLS_SERVER_KEY=/app/certs/server.key
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    labels:
    - traefik.enable=true
    - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`)
    - traefik.http.routers.api.entrypoints=web
    - traefik.http.services.api.loadbalancer.server.port=8000
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
  ingestion:
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: *id001
    networks: *id002
    logging: *id003
    image: alpha-bist-base
    container_name: alpha-ingestion
