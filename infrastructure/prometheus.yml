global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # === Application Services ===
  - job_name: 'alpha-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  - job_name: 'alpha-services'
    static_configs:
      - targets:
          - 'ingestion:8000'
          - 'feature-engine:8000'
          - 'market-state:8000'
          - 'intelligence:8000'
          - 'simulation:8000'
          - 'risk:8000'
          - 'portfolio:8000'
          - 'learning:8000'
    metrics_path: '/metrics'

  # === Data Stores (via Exporters) ===
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
    metrics_path: '/metrics'

  - job_name: 'clickhouse-2'
    static_configs:
      - targets: ['clickhouse-2:8123']
    metrics_path: '/metrics'

  # === Infrastructure ===
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/varz'

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics'
