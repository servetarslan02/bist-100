    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    environment:
    - TORCH_DEVICE=cuda
    - NVIDIA_VISIBLE_DEVICES=all
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-worker:
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-celery-worker
    mem_limit: 768m
    cpus: 1.0
    command:
    - celery
    - -A
    - services.tasks.queue
    - worker
    - --loglevel=info
    - --concurrency=2
    - --without-gossip
    - --without-mingle
    - --without-heartbeat
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=16M,mode=1777
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A services.tasks.queue inspect ping --timeout 5 || exit 1
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
  dashboard:
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: alpha-dashboard
    mem_limit: 256m
    cpus: 1.0
    ports:
    - 3000:3000
    environment:
    - API_URL=http://alpha-api:8000
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=PathPrefix(`/`)
    - traefik.http.routers.dashboard.entrypoints=web
    - traefik.http.services.dashboard.loadbalancer.server.port=3000
    tmpfs:
    - /tmp:size=16M,mode=1777
    depends_on:
    - api
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3000
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgres-exporter:
    profiles:
    - monitoring
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: alpha-postgres-exporter
    mem_limit: 64m
    cpus: 0.25
    ports:
    - 9187:9187
    environment:
      DATA_SOURCE_NAME: postgresql://alpha:${POSTGRES_PASSWORD}@postgres:5432/alpha_bist?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9187/metrics
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis-exporter:
    profiles:
    - monitoring
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: oliver006/redis_exporter:v1.73.0-alpine
    container_name: alpha-redis-exporter
    mem_limit: 64m
    cpus: 0.25
    ports:
    - 9121:9121
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9121/metrics
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
  prometheus:
    profiles:
    - monitoring
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: prom/prometheus:v3.14.0
    container_name: alpha-prometheus
    mem_limit: 512m
    cpus: 1.0
    ports:
    - 9090:9090
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=512MB
    - --storage.tsdb.wal-compression
    - --web.enable-lifecycle
    volumes:
    - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:9090/-/healthy
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 180s
  grafana:
    profiles:
    - monitoring
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: grafana/grafana:13.0.7
    container_name: alpha-grafana
    mem_limit: 256m
    cpus: 0.5
    ports:
    - 3001:3000
    volumes:
    - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_LOG_LEVEL: error
      GF_DATABASE_WAL: 'false'
      GF_EXPLORE_ENABLED: 'false'
      GF_ALERTING_ENABLED: 'false'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3000/api/health
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 240s
  mlflow:
    profiles:
    - monitoring
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: ghcr.io/mlflow/mlflow:v3.15.2
    container_name: alpha-mlflow
    mem_limit: 512m
    cpus: 1.0
    ports:
    - 5000:5000
    volumes:
    - mlflow_data:/mlflow
    command:
    - sh
    - -c
    - pip install -q psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD}@postgres:5432/alpha_mlflow
      --default-artifact-root /mlflow/artifacts --allowed-hosts '*' --workers 1
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD}@postgres:5432/alpha_mlflow
      MLFLOW_SERVER_ALLOWED_HOSTS: '*'
      MLFLOW_ALLOWED_HOSTS: '*'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 120s
  autoheal:
    image: willfarrell/autoheal
    restart: always
    networks: *id003
    logging: *id001
    mem_limit: 32m
    cpus: 0.25
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - AUTOHEAL_CONTAINER_LABEL=autoheal
    - AUTOHEAL_INTERVAL=300
    - AUTOHEAL_START_PERIOD=300
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f autoheal || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  postgres_data: null
  clickhouse_data: null
  zookeeper_data: null
  redis_data: null
  nats_data: null
  prometheus_data: null
  grafana_data: null
  mlflow_data: null
  questdb_data: null
networks:
  alpha-net:
    driver: bridge
