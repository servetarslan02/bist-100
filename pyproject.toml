[project]
name = "alpha-bist"
version = "2.1.0"
description = "BIST Market Intelligence & Quantitative Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "orjson>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "websockets>=17.0.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.1.0",
    "asyncpg>=0.30.0",
    "redis>=8.1.0",
    "clickhouse-connect>=1.7.0",
    "SQLAlchemy>=2.0.36",
    "numpy>=2.5.0",
    "polars>=1.30.0",
    "duckdb>=1.3.0",
    "questdb>=2.0.0",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.7.0",
    "xgboost>=3.4.0",
    "catboost>=1.2.10",
    "optuna>=4.9.0",
    "yfinance>=1.6.0",
    "torch>=2.13.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "mlflow>=3.15.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "E402",   # module-level import not at top (common in scripts with sys.path)
    "E741",   # ambiguous variable name (l used in financial formulas)
    "N801",   # class name should use CapWords (TestFaz0_X is clearer)
    "N802",   # function name should be lowercase (gRPC/property names)
    "N803",   # argument name should be lowercase (X, y, S, K, T are math notation)
    "N805",   # first argument should be self (inner class patterns)
    "N806",   # variable in function should be lowercase (X, y, Z, L are math notation)
    "N814",   # camelcase imported as constant (NATS client)
    "N817",   # camelcase imported as acronym (EventType as ET)
    "SIM102", # collapsible-if (nested ifs are clearer in complex logic)
    "SIM103", # needless-bool (explicit is fine)
    "SIM108", # ternary operator (if-else blocks are clearer for complex expressions)
    "SIM112", # uncapitalized environment variable
    "SIM115", # context manager for open (not always needed)
    "SIM116", # if-else-block-instead-of-dict-lookup
    "SIM117", # multiple with statements (nested is fine)
    "B007",   # unused loop control variable (common pattern)
    "UP035",  # deprecated import (typing.Dict still works fine)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow re-exports in __init__.py
"services/grpc/generated/*.py" = ["ALL"]  # Auto-generated gRPC code
"scripts/*.py" = ["SIM"]  # Scripts have different style needs
"tests/*.py" = ["SIM115"]  # NamedTemporaryFile in tests is standard pattern

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q --ignore=tests/e2e_full_test.py"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
