name: ALPHA v4 External Source Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: ["alpha-rebuild-v4"]
    paths:
      - "alpha_v4/acquisition.py"
      - "alpha_v4/providers.py"
      - "alpha_v4/source_catalog.py"
      - "alpha_v4/worker.py"
      - "alpha_v4/__main__.py"
      - ".github/workflows/alpha-v4-external-smoke.yml"

permissions:
  contents: read

jobs:
  official-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_id: kap-official
            surface: company-directory
          - source_id: bist-official-public
            surface: equity-market-data
          - source_id: tcmb-evds
            surface: documentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run governed worker cycle against official source
        env:
          SOURCE_ID: ${{ matrix.source_id }}
          SURFACE: ${{ matrix.surface }}
        shell: bash
        run: |
          set -euo pipefail
          DB_PATH="/tmp/external-${SOURCE_ID}.sqlite3"
          FIRST_JSON="/tmp/external-${SOURCE_ID}-first.json"
          DUP_JSON="/tmp/external-${SOURCE_ID}-duplicate.json"
          CYCLE_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_ID}-${SURFACE}"
          rm -f "$DB_PATH" "$FIRST_JSON" "$DUP_JSON"

          python -m alpha_v4 snapshot \
            --mode test \
            --db "$DB_PATH" \
            --source "$SOURCE_ID" \
            --surface "$SURFACE" \
            --owner github-actions \
            --cycle-key "$CYCLE_KEY" > "$FIRST_JSON"

          python -m alpha_v4 snapshot \
            --mode test \
            --db "$DB_PATH" \
            --source "$SOURCE_ID" \
            --surface "$SURFACE" \
            --owner github-actions-duplicate \
            --cycle-key "$CYCLE_KEY" > "$DUP_JSON"

          python - "$DB_PATH" "$FIRST_JSON" "$DUP_JSON" "$SOURCE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          from alpha_v4.runtime import AlphaRuntime, RuntimeConfig, RuntimeMode

          database = Path(sys.argv[1])
          first = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          duplicate = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          source_id = sys.argv[4]

          assert first["status"] == "SUCCEEDED"
          assert first["run_id"]
          assert first["document_id"]
          assert first["body_sha256"]
          assert first["byte_count"] > 100
          assert duplicate["status"] == "SKIPPED"
          assert duplicate["run_id"] is None

          runtime = AlphaRuntime(
              RuntimeConfig(mode=RuntimeMode.TEST, database_path=database)
          )
          document = runtime.raw_documents.get(first["document_id"])
          assert document is not None
          assert document.body_sha256 == first["body_sha256"]
          assert len(document.body) == first["byte_count"]
          assert runtime.jobs.get(first["run_id"]).status == "SUCCEEDED"
          assert runtime.audit.verify_chain().valid
          assert [entry.event_type for entry in runtime.audit.entries()] == [
              "SOURCE_SNAPSHOT_COMPLETED"
          ]
          source = runtime.source_registry.get(source_id)
          assert source.successful_observations == 1
          assert source.failed_observations == 0
          assert runtime.health()["ready"] is True

          print(
              json.dumps(
                  {
                      "source_id": source_id,
                      "status_code": document.status_code,
                      "bytes": len(document.body),
                      "sha256": document.body_sha256,
                      "url": document.url,
                      "worker_run_id": first["run_id"],
                      "duplicate_status": duplicate["status"],
                      "audit_valid": True,
                  },
                  sort_keys=True,
              )
          )
          PY
