        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  learning:
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-learning
    mem_limit: 1g
    cpus: 1.5
    command: python -m services.learning.main
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
