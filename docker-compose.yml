name: bist-100-main
x-common:
  restart: unless-stopped
  env_file: &id002
  - .env
  networks: &id003
  - alpha-net
  logging: &id001
    driver: json-file
    options:
      max-size: 100k
      max-file: '1'
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    container_name: alpha-traefik
    mem_limit: 128m
    cpus: 0.5
    logging: *id001
    ports:
    - 80:80
    - 443:443
    - 8080:8080
    volumes:
    - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
    - traefik.enable=false
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
    - api
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: timescale/timescaledb:latest-pg17
    container_name: alpha-postgres
    mem_limit: 512m
    cpus: 1.5
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/init:/docker-entrypoint-initdb.d:ro
    command:
    - postgres
    - -c
    - shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain
    - -c
    - fsync=on
    - -c
    - synchronous_commit=off
    - -c
    - full_page_writes=off
    - -c
    - max_connections=50
    - -c
    - shared_buffers=128MB
    - -c
    - work_mem=4MB
    - -c
    - maintenance_work_mem=64MB
    - -c
    - effective_cache_size=256MB
    - -c
    - wal_level=minimal
    - -c
    - max_wal_size=256MB
    - -c
    - min_wal_size=64MB
    - -c
    - max_wal_senders=0
    - -c
    - max_replication_slots=0
    - -c
    - hot_standby=off
    - -c
    - checkpoint_completion_target=0.5
    - -c
    - wal_buffers=8MB
    - -c
    - random_page_cost=1.1
    - -c
    - effective_io_concurrency=100
    - -c
    - max_worker_processes=2
    - -c
    - max_parallel_workers_per_gather=1
    - -c
    - max_parallel_workers=2
    - -c
    - max_parallel_maintenance_workers=1
    - -c
    - autovacuum_max_workers=2
    - -c
    - autovacuum_naptime=300
    - -c
    - log_min_duration_statement=1000
    - -c
    - pg_stat_statements.track=top
    - -c
    - auto_explain.log_min_duration=1000
    environment:
      POSTGRES_DB: alpha_bist
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U alpha -d alpha_bist
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 15s
  clickhouse:
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: alpha-clickhouse
    mem_limit: 1g
    cpus: 1.5
    ports:
    - 8123:8123
    - 9002:9000
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - ./database/clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    - ./database/clickhouse/config/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro
    - ./database/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: alpha_bist
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      zookeeper:
        condition: service_healthy
  zookeeper:
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    networks: *id003
    logging: *id001
    image: zookeeper:3.9.5
    container_name: alpha-zookeeper
    mem_limit: 256m
    cpus: 0.5
    ports:
    - 2181:2181
    volumes:
    - zookeeper_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - echo ruok | nc -w 2 127.0.0.1 2181 | grep imok
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: redis:8.8-alpine
    container_name: alpha-redis
    mem_limit: 256m
    cpus: 1.0
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command:
    - redis-server
    - --appendonly
    - 'no'
    - --save
    - '3600'
    - '1'
    - --save
    - '900'
    - '10'
    - --dir
    - /data
    - --maxmemory
    - 192mb
    - --maxmemory-policy
    - allkeys-lru
    - --requirepass
    - ${REDIS_PASSWORD}
    - --hz
    - '5'
    - --dynamic-hz
    - 'yes'
    - --lazyfree-lazy-eviction
    - 'yes'
    - --lazyfree-lazy-expire
    - 'yes'
    - --lazyfree-lazy-server-del
    - 'yes'
    - --activedefrag
    - 'yes'
    - --active-defrag-threshold-lower
    - '10'
    - --active-defrag-threshold-upper
    - '100'
    - --active-defrag-cycle-min
    - '1'
    - --active-defrag-cycle-max
    - '25'
    - --tcp-keepalive
    - '300'
    - --timeout
    - '0'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5s
  nats:
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: nats:2.14-alpine
    container_name: alpha-nats
    mem_limit: 128m
    cpus: 0.5
    ports:
    - 4222:4222
    - 8222:8222
    command:
    - nats-server
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats_data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:8222/healthz
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5s
  pgbouncer:
    restart: unless-stopped
    stop_grace_period: 10s
    networks: *id003
    logging: *id001
    image: edoburu/pgbouncer:latest
    container_name: alpha-pgbouncer
    mem_limit: 64m
    cpus: 0.5
    ports:
    - 6432:5432
    environment:
      DATABASE_URL: postgres://alpha:${POSTGRES_PASSWORD}@alpha-postgres:5432/alpha_bist
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      SERVER_IDLE_TIMEOUT: 300
      SERVER_LIFETIME: 3600
      SERVER_CONNECT_TIMEOUT: 15
      QUERY_TIMEOUT: 120
      QUERY_WAIT_TIMEOUT: 120
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
      STATS_PERIOD: 60
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -p 5432 -U alpha
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
  questdb:
    restart: unless-stopped
    stop_grace_period: 10s
    networks: *id003
    logging: *id001
    image: questdb/questdb:10.0.1
    container_name: alpha-questdb
    mem_limit: 512m
    cpus: 1.0
    ports:
    - 9009:9009
    - 8812:8812
    - 9000:9000
    volumes:
    - questdb_data:/var/lib/questdb
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      QDB_PG_NET_ENABLED: 'true'
      QDB_HTTP_ENABLED: 'true'
      QDB_LINE_TCP_ENABLED: 'true'
      QDB_LINE_TCP_NET_BIND_TO: 0.0.0.0:9009
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://127.0.0.1:9000/ping || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
  api:
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: *id002
    networks: *id003
    logging: *id001
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.api
    image: alpha-bist-base:latest
    container_name: alpha-api
    mem_limit: 1536m
    cpus: 2.0
    ports:
    - 8000:8000
    - 50051:50051
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./ai:/app/ai:ro
    - ./backtest:/app/backtest:ro
    - ./config:/app/config:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=32M,mode=1777
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    environment:
    - TORCH_DEVICE=cuda
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    - NATS_URL=nats://nats:4222
    - GRPC_PORT=50051
    - GRPC_HOSTS=alpha-api
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_SERVER_CERT=/app/certs/server.crt
    - MTLS_SERVER_KEY=/app/certs/server.key
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    labels:
    - traefik.enable=true
    - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)
    - traefik.http.routers.api.entrypoints=web
    - traefik.http.services.api.loadbalancer.server.port=8000
    - traefik.http.routers.api.middlewares=rate-limit@file,compress@file
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
  ingestion:
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-ingestion
    mem_limit: 512m
    cpus: 1.0
    command: python -m services.ingestion.main
    volumes:
    - ./services:/app/services:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=16M,mode=1777
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    - NATS_URL=nats://nats:4222
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  feature-engine:
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-feature-engine
    mem_limit: 1g
    cpus: 1.5
    command: python -m services.features.main
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=16M,mode=1777
    environment:
    - TORCH_DEVICE=cpu
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  market-state:
