name: ALPHA v4 Safe Autofix

on:
  push:
    branches: ["alpha-rebuild-v4"]
    paths:
      - ".github/workflows/alpha-v4-autofix.yml"

permissions:
  contents: write

jobs:
  safe-autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: alpha-rebuild-v4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade ruff

      - name: Apply safe Ruff fixes
        run: ruff check --fix --exit-zero alpha_v4 tests/alpha_v4

      - name: Format V4 code and tests
        run: ruff format alpha_v4 tests/alpha_v4

      - name: Reject whitespace corruption
        run: git diff --check

      - name: Commit safe fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safe Ruff/format changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha_v4 tests/alpha_v4
          git commit -m "Apply safe Ruff fixes and formatting"
          git push origin HEAD:alpha-rebuild-v4

# rerun-safe-format: 2
