[project]
name = "alpha-bist"
version = "2.1.0"
description = "BIST Market Intelligence & Quantitative Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "orjson>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "websockets>=17.0.0",
    "structlog>=26.1.0",
    "python-dotenv>=1.1.0",
    "asyncpg>=0.30.0",
    "redis>=8.1.0",
    "clickhouse-connect>=1.7.0",
    "SQLAlchemy>=2.0.36",
    "numpy>=2.5.0",
    "pandas>=3.0.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.7.0",
    "xgboost>=3.4.0",
    "catboost>=1.2.10",
    "optuna>=4.9.0",
    "yfinance>=1.6.0",
    "torch>=2.13.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "mlflow>=3.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q --ignore=tests/e2e_full_test.py"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
