[pytest]
# e2e_full_test.py bir pytest test modülü değil; gerçek internet bağlantısı
# gerektiren bağımsız bir script olarak tasarlanmış (`python3 tests/e2e_full_test.py`
# ile çalıştırılır). Fonksiyon imzaları pytest fixture sistemine uymuyor
# (def test_x(t: E2ETest) - t bir fixture değil, manuel geçirilen bir nesne),
# bu yüzden pytest koleksiyonundan hariç tutuluyor.
addopts = --ignore=tests/e2e_full_test.py
asyncio_mode = auto
