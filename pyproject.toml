[project]
name = "alpha-bist"
version = "2.0.0"
description = "BIST Market Intelligence & Quantitative Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "orjson>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "clickhouse-connect>=0.7.16",
    "SQLAlchemy>=2.0.30",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.4.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.5",
    "optuna>=3.6.0",
    "yfinance>=0.2.40",
    "torch>=2.4.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "mlflow>=2.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q --ignore=tests/e2e_full_test.py"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
