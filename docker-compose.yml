name: bist-100-main
x-common:
  restart: unless-stopped
  env_file: &id001
  - .env
  networks: &id002
  - alpha-net
  logging: &id003
    driver: json-file
    options:
      max-size: 1m
      max-file: '1'
services:
  traefik:
    image: traefik:v3.2
    container_name: alpha-traefik
    ports:
    - 80:80
    - 443:443
    - 8080:8080
    volumes:
    - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
    - traefik.enable=true
    - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`)
    - traefik.http.routers.api.entrypoints=web
    - traefik.http.services.api.loadbalancer.server.port=8000
    - traefik.http.routers.api.middlewares=rate-limit@file,compress@file
    mem_limit: 64m
    cpus: 0.15
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
    - api
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: *id001
    networks: *id002
    logging: *id003
    image: postgres:17-alpine
    container_name: alpha-postgres
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/init:/docker-entrypoint-initdb.d:ro
    command: "postgres\n  -c fsync=on\n  -c synchronous_commit=on\n  -c full_page_writes=on\n  -c max_connections=20\n  -c\
      \ shared_buffers=64MB\n  -c work_mem=2MB\n  -c effective_cache_size=128MB\n  -c wal_level=replica\n  -c max_wal_size=256MB\n\
      \  -c max_wal_senders=3\n  -c max_replication_slots=3\n  -c hot_standby=on\n  -c min_wal_size=16MB\n  -c checkpoint_completion_target=0.9\n\
      \  -c wal_buffers=4MB\n"
    environment:
      POSTGRES_DB: alpha_bist
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    mem_limit: 256m
    cpus: 0.5
    storage_opt:
      size: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U alpha -d alpha_bist
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
  postgres-replica:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: postgres:17-alpine
    container_name: alpha-postgres-replica
    ports:
    - 5433:5432
    volumes:
    - postgres_replica_data:/var/lib/postgresql/data
    - ./database/replica/setup.sh:/setup.sh:ro
    entrypoint:
    - /bin/bash
    - /setup.sh
    environment:
      POSTGRES_DB: alpha_bist
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PRIMARY_HOST: alpha-postgres
      PRIMARY_PORT: '5432'
      REPL_USER: replicator
    mem_limit: 256m
    cpus: 0.5
    storage_opt:
      size: 256M
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U alpha -d alpha_bist
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
  clickhouse:
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: *id001
    networks: *id002
    logging: *id003
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: alpha-clickhouse
    ports:
    - 8123:8123
    - 9000:9000
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - ./database/clickhouse/config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    - ./database/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: alpha_bist
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    mem_limit: 384m
    cpus: 0.75
    storage_opt:
      size: 512M
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      zookeeper:
        condition: service_healthy
  zookeeper:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: zookeeper:3.9
    container_name: alpha-zookeeper
    ports:
    - 2181:2181
    volumes:
    - zookeeper_data:/data
    mem_limit: 128m
    cpus: 0.15
    healthcheck:
      test:
      - CMD-SHELL
      - echo ruok | nc -w 2 localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  clickhouse-2:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: alpha-clickhouse-2
    ports:
    - 8124:8123
    - 9001:9000
    volumes:
    - clickhouse_2_data:/var/lib/clickhouse
    - ./database/clickhouse/config/cluster-2.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    - ./database/clickhouse/init:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: alpha_bist
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    mem_limit: 384m
    cpus: 0.75
    storage_opt:
      size: 512M
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    depends_on:
      zookeeper:
        condition: service_healthy
  redis:
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: *id001
    networks: *id002
    logging: *id003
    image: redis:8-alpine
    container_name: alpha-redis
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    command: "redis-server\n  --appendonly yes\n  --appendfsync everysec\n  --dir /data\n  --maxmemory 96mb\n  --maxmemory-policy\
      \ allkeys-lru\n  --requirepass ${REDIS_PASSWORD}\n  --masterauth ${REDIS_PASSWORD}\n"
    mem_limit: 128m
    cpus: 0.25
    storage_opt:
      size: 128M
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  redis-sentinel-1:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: redis:8-alpine
    container_name: alpha-sentinel-1
    entrypoint:
    - /bin/sh
    - /etc/sentinel/entrypoint.sh
    volumes:
    - ./infrastructure/sentinel/sentinel-1.conf.template:/etc/sentinel/sentinel.conf.template:ro
    - ./infrastructure/sentinel/entrypoint.sh:/etc/sentinel/entrypoint.sh:ro
    - sentinel_1_data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 32m
    cpus: 0.1
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -p
      - '26379'
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis-sentinel-2:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: redis:8-alpine
    container_name: alpha-sentinel-2
    entrypoint:
    - /bin/sh
    - /etc/sentinel/entrypoint.sh
    volumes:
    - ./infrastructure/sentinel/sentinel-2.conf.template:/etc/sentinel/sentinel.conf.template:ro
    - ./infrastructure/sentinel/entrypoint.sh:/etc/sentinel/entrypoint.sh:ro
    - sentinel_2_data:/data
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 32m
    cpus: 0.1
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -p
      - '26379'
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis-sentinel-3:
    restart: unless-stopped
