name: ALPHA v4 Core CI

on:
  push:
    branches: ["alpha-rebuild-v4"]
    paths:
      - "alpha_v4/**"
      - "tests/alpha_v4/**"
      - ".github/workflows/alpha-v4-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "alpha_v4/**"
      - "tests/alpha_v4/**"
      - ".github/workflows/alpha-v4-ci.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality and test dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Compile clean core
        run: python -m compileall -q alpha_v4 tests/alpha_v4

      - name: Static quality gate
        run: ruff check alpha_v4 tests/alpha_v4

      - name: Run ALPHA v4 tests
        run: python -m pytest -q tests/alpha_v4 --disable-warnings --maxfail=1
