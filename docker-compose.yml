    tmpfs:
    - /tmp:size=8M,mode=1777
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
