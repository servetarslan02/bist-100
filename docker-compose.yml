        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    environment:
    - TORCH_DEVICE=cuda
    - NVIDIA_VISIBLE_DEVICES=all
    - REDIS_SENTINEL_HOSTS=alpha-sentinel-1:26379,alpha-sentinel-2:26379,alpha-sentinel-3:26379
    - REDIS_SENTINEL_MASTER=alpha-master
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-worker:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: alpha-bist-base
    container_name: alpha-celery-worker
    command: celery -A services.tasks.queue worker --loglevel=info --concurrency=2
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=16M,mode=1777
    environment:
    - REDIS_HOST=redis
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - REDIS_SENTINEL_HOSTS=alpha-sentinel-1:26379,alpha-sentinel-2:26379,alpha-sentinel-3:26379
    - REDIS_SENTINEL_MASTER=alpha-master
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A services.tasks.queue inspect ping --timeout 5 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
  dashboard:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: alpha-dashboard
    ports:
    - 3000:3000
    environment:
    - API_URL=http://alpha-api:8000
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=PathPrefix(`/`)
    - traefik.http.routers.dashboard.entrypoints=web
    - traefik.http.services.dashboard.loadbalancer.server.port=3000
    tmpfs:
    - /tmp:size=16M,mode=1777
    mem_limit: 128m
    cpus: 0.25
    depends_on:
    - api
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgres-exporter:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: alpha-postgres-exporter
    ports:
    - 9187:9187
    environment:
      DATA_SOURCE_NAME: postgresql://alpha:${POSTGRES_PASSWORD}@postgres:5432/alpha_bist?sslmode=disable
    mem_limit: 32m
    cpus: 0.1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9187/metrics
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  redis-exporter:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: oliver006/redis_exporter:v1.73.0
    container_name: alpha-redis-exporter
    ports:
    - 9121:9121
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 32m
    cpus: 0.1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9121/metrics
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  prometheus:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: prom/prometheus:v3.14.0
    container_name: alpha-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    mem_limit: 64m
    cpus: 0.15
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  grafana:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: grafana/grafana:13.0.7
    container_name: alpha-grafana
    ports:
    - 3001:3000
    volumes:
    - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    mem_limit: 64m
    cpus: 0.15
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  mlflow:
    restart: unless-stopped
    env_file: *id001
    networks: *id002
    logging: *id003
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: alpha-mlflow
    ports:
    - 5000:5000
    volumes:
    - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root
      /mlflow/artifacts --workers 1
    mem_limit: 128m
    cpus: 0.15
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:5000/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  autoheal:
    image: willfarrell/autoheal
    restart: always
    networks: *id002
    logging: *id003
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - AUTOHEAL_CONTAINER_LABEL=all
    - AUTOHEAL_INTERVAL=30
    - AUTOHEAL_START_PERIOD=120
    mem_limit: 32m
    cpus: 0.1
volumes:
  postgres_data: null
  postgres_replica_data: null
  clickhouse_data: null
  clickhouse_2_data: null
  zookeeper_data: null
  redis_data: null
  nats_data: null
  prometheus_data: null
  grafana_data: null
  mlflow_data: null
  sentinel_1_data: null
  sentinel_2_data: null
  sentinel_3_data: null
networks:
  alpha-net:
    driver: bridge
