    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-market-state
    mem_limit: 512m
    cpus: 1.0
    command: python -m services.market_state.main
    volumes:
    - ./services:/app/services:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=8M,mode=1777
    environment:
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  intelligence:
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-intelligence
    mem_limit: 1g
    cpus: 1.5
    command: python -m services.intelligence.main
    volumes:
    - ./services:/app/services:ro
    - ./ml:/app/ml:ro
    - ./ai:/app/ai:ro
    - ./data:/app/data
    - ./.env:/app/.env:ro
    - ./infrastructure/mtls/certs:/app/certs:ro
    tmpfs:
    - /tmp:size=32M,mode=1777
    environment:
    - TORCH_DEVICE=cpu
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - MTLS_CA_CERT=/app/certs/ca.crt
    - MTLS_CLIENT_CERT=/app/certs/client.crt
    - MTLS_CLIENT_KEY=/app/certs/client.key
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
  simulation:
    restart: unless-stopped
    env_file: *id002
    networks: *id003
    logging: *id001
    image: alpha-bist-base:latest
    container_name: alpha-simulation
    mem_limit: 1g
    cpus: 1.5
    command: python -m services.simulation.main
    volumes:
